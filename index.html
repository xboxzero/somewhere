<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Xero Wiki</title>
<meta name="description" content="A wiki you can edit straight from the browser." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236d5efc'/><path d='M8 10h16M8 16h16M8 22h10' stroke='white' stroke-width='2.5' stroke-linecap='round'/></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Xero Wiki</a>
    <nav id="page-nav" class="page-nav"></nav>
    <div class="topbar-actions">
      <div class="temp-control">
        <button id="temp-auto" type="button" title="Follow the colour temperature of daylight">Auto</button>
        <input id="temp-slider" type="range" min="1800" max="12000" step="100"
               title="Colour temperature of the theme" />
        <span id="temp-readout">9200K</span>
      </div>
      <button id="sound-toggle" type="button" title="Interactive sound in Ethiopian qenet modes">Sound</button>
      <select id="qenet-select" class="hidden" title="Qenet mode">
        <option value="tizita">Tizita</option>
        <option value="bati">Bati</option>
        <option value="ambassel">Ambassel</option>
        <option value="anchihoye">Anchihoye</option>
      </select>
      <a class="graph-link" href="#/graph">Network</a>
      <button id="new-page-btn" class="primary hidden" type="button">+ New page</button>
      <button id="login-btn" class="primary" type="button">Login</button>
      <button id="logout-btn" class="hidden" type="button">Logout</button>
    </div>
  </header>

  <canvas id="code-rain" class="code-rain" aria-hidden="true"></canvas>

  <div id="hero" class="hero"></div>

  <main id="app">
    <p class="muted">Loading…</p>
  </main>

  <dialog id="login-dialog">
    <form id="login-form">
      <h2>Login</h2>
      <p class="muted">
        Paste a GitHub <strong>fine-grained personal access token</strong> that can access
        this repository with <strong>Contents: Read and write</strong>. It is stored only in
        this browser and sent only to <code>api.github.com</code>.
      </p>
      <input id="token-input" type="password" placeholder="github_pat_…" autocomplete="off" />
      <p id="login-error" class="error"></p>
      <div class="dialog-actions">
        <button type="button" id="login-cancel">Cancel</button>
        <button type="submit" id="login-save" class="primary">Log in</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
